# Render Blueprint (Infrastructure as Code) for Personal Finance Advisor Bot.
# This file lets you deploy with one click via "New + Blueprint" on Render,
# using this repository. You can also skip this file entirely and configure
# the same settings manually in the Render dashboard (see README.md).
services:
  - type: web
    name: personal-finance-advisor-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false        # set manually in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/data/finance.db
    disk:
      name: finance-data
      mountPath: /opt/render/project/data
      sizeGB: 1
